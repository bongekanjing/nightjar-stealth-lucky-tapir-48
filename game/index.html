<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightjar — a stealth game in the Ember Conservatory</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Nightjar: a top-down stealth game. Move with WASD, crouch with C, sprint with Shift. Take the Ember Relic from the orchid room, then reach the west gate unseen, past six guards whose vision cones are drawn on the floor."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
